<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hugo AI Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">

  <!-- Header Section -->
  <header class="p-4 border-b border-gray-800 flex flex-wrap gap-4 justify-between items-center bg-gray-950">
    <h1 class="text-xl font-bold text-blue-400">Hugo AI Chat</h1>
    
    <div class="flex flex-wrap gap-2 items-center">
      <!-- API Key Input -->
      <input id="apiKey" type="password" placeholder="Enter API Key" 
        class="bg-gray-800 border border-gray-700 text-sm rounded px-3 py-1.5 focus:outline-none focus:border-blue-500">
      
      <!-- Connect / Fetch Models Button -->
      <button onclick="fetchModels()" 
        class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-1.5 rounded transition">
        Connect
      </button>

      <!-- Dynamic Model Selector -->
      <select id="modelSelect" class="bg-gray-800 border border-gray-700 text-sm rounded px-3 py-1.5 focus:outline-none focus:border-blue-500">
        <option value="">-- Connect first --</option>
      </select>
    </div>
  </header>

  <!-- Chat Log Area -->
  <main id="chatLog" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full">
    <div class="text-center text-gray-500 my-8">輸入 API Key 並點擊 Connect 以載入可用的模型。</div>
  </main>

  <!-- Input Footer -->
  <footer class="p-4 border-t border-gray-800 bg-gray-950">
    <div class="max-w-4xl mx-auto flex gap-2">
      <textarea id="userInput" rows="1" placeholder="Type a message..." 
        class="flex-1 bg-gray-800 border border-gray-700 rounded p-2 focus:outline-none focus:border-blue-500 resize-none"
        onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
      <button onclick="sendMessage()" 
        class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded transition font-medium">
        Send
      </button>
    </div>
  </footer>

  <script>
    const OLLAMA_HOST = 'https://ollama.hugow.dev';
    let chatHistory = [];

    // 自動記憶或載入 API Key
    document.getElementById('apiKey').value = localStorage.getItem('ollama_api_key') || '';

    // 1. 動態抓取目前電腦有的 Models
    async function fetchModels() {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) return alert('Please enter your API Key!');

      localStorage.setItem('ollama_api_key', apiKey);
      const select = document.getElementById('modelSelect');
      select.innerHTML = '<option>Loading...</option>';

      try {
        const res = await fetch(`${OLLAMA_HOST}/api/tags`, {
          headers: { 'Authorization': `Bearer ${apiKey}` }
        });

        if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
        
        const data = await res.json();
        select.innerHTML = '';
        
        if (data.models && data.models.length > 0) {
          data.models.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.name;
            opt.textContent = `${m.name} (${m.details.parameter_size || 'N/A'})`;
            select.appendChild(opt);
          });
          alert('Successfully loaded models!');
        } else {
          select.innerHTML = '<option value="">No models found</option>';
        }
      } catch (err) {
        alert('Failed to connect: ' + err.message);
        select.innerHTML = '<option value="">Connection Failed</option>';
      }
    }

    // 2. 傳送訊息與 Streaming 回應
    async function sendMessage() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const model = document.getElementById('modelSelect').value;
      const inputEl = document.getElementById('userInput');
      const text = inputEl.value.trim();

      if (!apiKey) return alert('Please enter API Key');
      if (!model) return alert('Please select a model first');
      if (!text) return;

      inputEl.value = '';
      appendMessage('user', text);
      chatHistory.push({ role: 'user', content: text });

      const aiMsgDiv = appendMessage('assistant', '');

      try {
        const res = await fetch(`${OLLAMA_HOST}/v1/chat/completions`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: model,
            messages: chatHistory,
            stream: true
          })
        });

        if (!res.ok) throw new Error(`Status ${res.status}`);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let fullResponse = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n').filter(l => l.trim().startsWith('data: '));

          for (const line of lines) {
            const payload = line.replace('data: ', '').trim();
            if (payload === '[DONE]') break;
            try {
              const parsed = JSON.parse(payload);
              const content = parsed.choices[0]?.delta?.content || '';
              fullResponse += content;
              aiMsgDiv.textContent = fullResponse;
              document.getElementById('chatLog').scrollTop = document.getElementById('chatLog').scrollHeight;
            } catch (e) {}
          }
        }

        chatHistory.push({ role: 'assistant', content: fullResponse });

      } catch (err) {
        aiMsgDiv.textContent = 'Error: ' + err.message;
        aiMsgDiv.classList.add('text-red-400');
      }
    }

    // 渲染對話 Message 框
    function appendMessage(role, text) {
      const log = document.getElementById('chatLog');
      const div = document.createElement('div');
      div.className = `p-3 rounded-lg max-w-2xl ${
        role === 'user' 
          ? 'bg-blue-600 text-white ml-auto' 
          : 'bg-gray-800 text-gray-100 mr-auto border border-gray-700'
      }`;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }
  </script>
</body>
</html>
